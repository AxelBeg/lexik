<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Lexik — Menu principal (sombre)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #0a0c11; color: #eceef4; font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0a0c11; display: flex; flex-direction: column; padding: 60px 24px 40px;">

  <div style="display: flex; align-items: center; justify-content: flex-end; height: 24px;">

    </div>
  </div>

  <div style="flex: 1 1 0;"></div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
    <div style="font-size: 36px; font-weight: 600; letter-spacing: 0.32em; text-indent: 0.32em; line-height: 1;">LEXIK</div>
    <div style="display: flex; gap: 7px; align-items: center;">
      <div style="width: 5px; height: 5px; border-radius: 3px; background: #3f5496;"></div>
      <div style="width: 5px; height: 5px; border-radius: 3px; background: #4a6fbf;"></div>
      <div style="width: 5px; height: 5px; border-radius: 3px; background: #5f8bb0;"></div>
      <div style="width: 5px; height: 5px; border-radius: 3px; background: #9c9078;"></div>
      <div style="width: 5px; height: 5px; border-radius: 3px; background: #d29a4a;"></div>
      <div style="width: 5px; height: 5px; border-radius: 3px; background: #ee8038;"></div>
      <div style="width: 5px; height: 5px; border-radius: 3px; background: #ff4530;"></div>
    </div>
  </div>

  <div style="flex: 1.2 1 0;"></div>

  <div style="display: flex; flex-direction: column; gap: 12px;">

    <div style="background: #141821; border: 1px solid #242b39; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 18px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="font-size: 11px; letter-spacing: 0.2em; color: #737d92; font-weight: 500;">QUOTIDIEN</div>
        <div class="mono" style="font-size: 11px; color: #4c5568;">#428</div>
      </div>
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 7px;">
          <div style="font-size: 21px; font-weight: 600; line-height: 1.1;">Reprendre la partie</div>
          <div style="font-size: 13px; color: #737d92;">18 essais &middot; meilleur score <span class="mono" style="color: #ee8038; font-weight: 500;">87</span></div>
        </div>
        <div style="width: 44px; height: 44px; flex: 0 0 auto; border-radius: 22px; background: #1e2531; display: flex; align-items: center; justify-content: center; color: #eceef4;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
        </div>
      </div>
      <div style="height: 3px; border-radius: 2px; background: #1c2330; overflow: hidden;">
        <div style="width: 87%; height: 3px; border-radius: 2px; background: linear-gradient(90deg, #3f5496, #5f8bb0, #d29a4a, #ee8038);"></div>
      </div>
    </div>

    <div style="background: #141821; border: 1px solid #242b39; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 18px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="font-size: 11px; letter-spacing: 0.2em; color: #737d92; font-weight: 500;">CAMPAGNE</div>
        <svg width="14" height="14" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="13" r="9.5" fill="#245a66"></circle><path d="M13 3.5a9.5 9.5 0 0 1 0 19" fill="#3f8a99"></path></svg>
      </div>
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 7px;">
          <div style="font-size: 21px; font-weight: 600; line-height: 1.1;">Continuer sur Terre</div>
          <div style="font-size: 13px; color: #737d92;"><span class="mono">12</span> / <span class="mono">30</span> niveaux termin&eacute;s</div>
        </div>
        <div style="width: 44px; height: 44px; flex: 0 0 auto; border-radius: 22px; background: #1e2531; display: flex; align-items: center; justify-content: center; color: #eceef4;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
        </div>
      </div>
      <div style="height: 3px; border-radius: 2px; background: #1c2330; overflow: hidden;">
        <div style="width: 40%; height: 3px; border-radius: 2px; background: #8b94a8;"></div>
      </div>
    </div>

  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; margin-top: 20px;">
    <div style="display: flex; align-items: center; gap: 9px; color: #d29a4a;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 18h5"></path><path d="M10.5 21h3"></path><path d="M12 3a6 6 0 0 0-3.6 10.8c.5.4.8.9.9 1.5l.1.7h5.2l.1-.7c.1-.6.4-1.1.9-1.5A6 6 0 0 0 12 3z"></path></svg>
      <span class="mono" style="font-size: 16px; font-weight: 500;">12</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; color: #737d92;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3c.6 3-1.2 4.2-2.6 5.6C8 10 7 11.4 7 13.6A5 5 0 0 0 12 19a5 5 0 0 0 5-5.4c0-2.6-1.5-4-2.8-5.4"></path></svg>
      <span style="font-size: 13px;">S&eacute;rie de 8 jours</span>

</div>

</html>
