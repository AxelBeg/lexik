<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .wrap {
    width: 1024px;
    height: 1024px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
  }
  .k {
    font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
    font-weight: 700;
    font-size: 900px;
    line-height: 1;
    display: inline-block;
    background: linear-gradient(180deg, #34489a 0%, #47789b 25%, #86775c 50%, #d1651c 75%, #cf2d18 100%);
    color: transparent;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
</style>
</head>
<body>
  <div class="wrap"><span class="k">K</span></div>
</body>
</html>
